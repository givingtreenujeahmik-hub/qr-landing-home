<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafb">
<title>nujeahmik · 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&family=Poppins:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#e9e8ef;
    display:flex;align-items:flex-start;justify-content:center;
    min-height:100dvh;
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #screen{
    position:relative;
    width:390px;max-width:100vw;
    min-height:895px;
    background:#fafafb;
    overflow:hidden;
    flex:0 0 auto;
  }
  @media(min-width:430px){
    body{align-items:center}
    /* 고정 height 대신 min-height 유지 — 커스텀 배너·SNS 섹션이 추가돼 콘텐츠가
       895px보다 길어져도 (overflow:hidden 때문에) 안 잘리고 프레임이 같이 늘어납니다 */
    #screen{border-radius:30px;box-shadow:0 20px 60px rgba(30,30,60,.14)}
  }

  /* ── 세로 레이아웃 (content: pad 44/40, gap 22) ── */
  .content{display:flex;flex-direction:column;align-items:center;
    gap:22px;padding:44px 0 40px}

  /* 로고 알약 */
  .mark-pill{background:#fff;border-radius:999px;padding:9px 20px;
    box-shadow:0 4px 14px rgba(31,31,46,.14)}
  .mark-pill span{font-family:"Poppins",sans-serif;font-weight:700;font-style:italic;
    font-size:15px;line-height:23px;color:#282532;display:block}

  /* 타이틀 */
  .title-block{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
  .title{font-family:"Jua",sans-serif;font-weight:400;font-size:23px;line-height:1.26;
    color:#282532;text-align:center}
  .subtitle{font-weight:500;font-size:13px;color:#706b7d;text-align:center}

  /* 카드 공통 */
  .hero,.products{width:100%;padding:0 20px}
  .products{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:14px}
  .card{position:relative;display:block;border:none;padding:0;cursor:pointer;
    box-shadow:0 4px 14px rgba(31,31,46,.14);overflow:hidden;background:#dee7f3}
  .card img{display:block;width:100%;height:100%;object-fit:cover}
  .hero-card{width:100%;aspect-ratio:350/230;border-radius:24px}
  .cell{flex:1 1 0;min-width:0;aspect-ratio:1/1;border-radius:20px}
  .card:active{transform:scale(.985);transition:transform .12s}

  /* 푸터 */
  .footer{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:14px;width:100%}
  .footer .fmark{font-family:"Poppins",sans-serif;font-weight:700;font-style:italic;
    font-size:14px;line-height:21px;color:#17171c}
  .footer .fsub{font-weight:500;font-size:11px;color:#706b7d;text-align:center}

  /* 커스텀 만들기 바로가기 — 브랜드 핑크로 강조해서 홈에서 바로 눈에 띄게.
     한 줄짜리 짧은 알약으로 만들어서 화면 크기와 상관없이 안 잘리게 합니다. */
  .make-wrap{width:100%;padding:0 20px}
  .make-btn{width:100%;height:58px;display:flex;align-items:center;gap:11px;text-decoration:none;
    border:none;border-radius:999px;padding:0 18px;cursor:pointer;
    background:linear-gradient(135deg,#F5679B,#EF3F82);
    box-shadow:0 10px 24px rgba(245,103,155,.42);transition:transform .14s}
  .make-btn:active{transform:scale(.99)}
  .make-btn .ic{flex:0 0 auto;font-size:19px;line-height:1}
  .make-btn .tcol{flex:1 1 auto;min-width:0}
  .make-btn .tt{font-weight:700;font-size:15.5px;color:#fff;white-space:nowrap}
  .make-btn .ar{flex:0 0 auto;font-weight:700;font-size:19px;color:#fff;line-height:1}

  /* 하단: SNS · 공식몰 · 매장 오시는 길 */
  .bottom{width:100%;padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:11px}
  .save-note{font-weight:500;font-size:13px;color:#706b7d;text-align:center}
  .mini-icons{display:flex;gap:16px;justify-content:center;align-items:center;padding:11px 0}
  .mini{width:52px;height:52px;border-radius:999px;background:#fff;
    box-shadow:0 4px 14px rgba(31,31,46,.14);display:flex;align-items:center;justify-content:center;
    text-decoration:none;cursor:pointer;transition:transform .14s}
  .mini:active{transform:scale(.9)}
  .mini .web{font-size:22px;line-height:1;color:#4d475c}
  .mini svg{width:30px;height:30px;display:block}
  .mini img.logo-ic{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block}
  .pill-btn{width:100%;display:flex;align-items:center;gap:13px;text-decoration:none;
    background:#fff;border-radius:20px;padding:13px 18px 13px 14px;
    box-shadow:0 4px 14px rgba(31,31,46,.14);cursor:pointer;transition:transform .14s}
  .pill-btn:active{transform:scale(.99)}
  .pill-btn .tcol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
  .pill-btn .tt{font-weight:700;font-size:14.5px;color:#282532}
  .pill-btn .ts{font-weight:500;font-size:11.5px;color:#706b7d}
  .pill-btn .ar{flex:0 0 auto;font-weight:700;font-size:19px;color:#9e99ad;line-height:1}
</style>
</head>
