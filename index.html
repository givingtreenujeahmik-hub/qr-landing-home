<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#e9e8ef;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 화면 (피그마 프레임 390 × 844) ── */
  #screen{
    position:relative;
    width:390px;height:844px;
    background:#fcfbfe;
    /* 세로만 스크롤 허용 — 언어 버튼까지 다 절대좌표(top:570~778px)로 잡혀 있어서,
       화면이 짧은 폰(아이폰 SE 등, 100dvh<778px)에서는 overflow:hidden이면
       마지막 일본어 버튼이 아예 안 보이게 잘립니다. */
    overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
    flex:0 0 auto;
  }
  @media(min-width:430px){
    #screen{border-radius:30px;box-shadow:0 20px 60px rgba(30,30,60,.14)}
  }
  /* 폰이 화면보다 작을 때: 세로 스크롤 허용, 가로는 축소 */
  @media(max-width:430px){
    body{align-items:flex-start}
    #screen{width:100vw;height:auto;min-height:100dvh;border-radius:0}
  }

  /* ── 배경 블롭 (블러 파스텔) ── */
  .blob{position:absolute;left:100px;width:193px;height:193px;border-radius:50%;
    filter:blur(4px);pointer-events:none}
  .blob.mint  {top:-94px;opacity:.40;background:linear-gradient(180deg,#25c7b4,#16a294)}
  .blob.blue  {top:1px;  opacity:.20;background:linear-gradient(180deg,#854ff2,#6a2ee6)}
  .blob.pink  {top:100px;opacity:.20;background:linear-gradient(180deg,#f55fa4,#e53c8b)}
  .blob.yellow{top:195px;opacity:.20;background:linear-gradient(180deg,#ffd132,#fab414)}

  /* ── 로고 ── */
  /* width:100%(고정 390px 아님) — 화면 폭이 390px보다 좁은 폰(360px대 안드로이드 등)에서도
     안 잘리고 정확히 가운데 오도록 #screen 실제 폭 기준으로 잡습니다. */
  .mark{position:absolute;top:51px;left:0;width:100%;text-align:center;
    font-family:"Poppins",sans-serif;font-weight:700;font-style:italic;
    font-size:24px;line-height:36px;color:#fff}

  /* ── 모루 이미지 ── */
  .moru{position:absolute;left:50%;top:110px;width:180px;height:270px;z-index:5;transform:translateX(-50%);
    object-fit:contain}
  .moru-ph{position:absolute;left:87px;top:152px;width:214px;height:225px;z-index:5;
    display:flex;align-items:center;justify-content:center;
    border:2px dashed #c9c3d6;border-radius:16px;color:#a49db4;
    font-size:12px;font-weight:600;background:rgba(255,255,255,.35)}

  /* ── 인사말 ── */
  .greet{position:absolute;top:398px;left:0;width:100%;text-align:center;
    font-weight:700;font-size:20px;line-height:24px;color:#2a2634}
  .greet-sub{position:absolute;top:436px;left:0;width:100%;text-align:center;
    font-weight:500;font-size:13px;line-height:160%;color:#6b6675}
  .pick{position:absolute;top:534px;left:0;width:100%;text-align:center;
    font-weight:500;font-size:12.5px;line-height:1;color:#6b6675}

  /* ── 언어 버튼 (chat.html의 langButtons() 팔레트와 동일하게 맞춤:
       pinkL/tealL/yellowL/purpleL/blueL, 불투명, 흰 글자) ── */
  /* left+right 로 잡아서(고정 width 340px 아님) 화면이 좁아져도
     양쪽 25px 여백만 유지한 채 안 잘리고 줄어듭니다. */
  .lang-group{position:absolute;left:25px;right:25px;top:570px;
    display:flex;flex-direction:column;gap:14px}
  .lang-row{display:flex;gap:14px}
  .lb{height:60px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15.5px;color:#fff;
    box-shadow:0 3px 9px rgba(31,23,51,.16);border:none;cursor:pointer;
    transition:transform .14s}
  .lb:active{transform:scale(.96)}
  .lb.half{flex:1 1 0;min-width:0}
  .lb.full{width:100%}
  .lb.ko{background:#F291AE}
  .lb.en{background:#7ED4C0}
  .lb.cn{background:#FBD46D}
  .lb.jp{background:#8CB4F0}
</style>
